<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nirvana Photoworks</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    background:#0a0a0a;
    color:#fff;
    font-family:'Inter', sans-serif;
}

/* NAV */
.nav{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:center;
    gap:30px;
    padding:20px;
    background:rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    z-index:1000;
}

.nav a{
    color:#c9a24e;
    text-decoration:none;
    font-size:14px;
    letter-spacing:1px;
}

.nav a:hover{
    color:#fff;
}

/* HERO */
.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background: radial-gradient(circle at center,#1a1a1a,#000);
    padding:20px;
}

.hero img{
    width:180px;
    margin-bottom:20px;
    filter: drop-shadow(0 0 10px rgba(201,162,78,0.3));
}

.hero h1{
    font-family:'Playfair Display', serif;
    font-size:48px;
    margin:10px 0;
    color:#c9a24e;
    letter-spacing:2px;
}

.hero p{
    color:#aaa;
    font-size:16px;
    max-width:500px;
}

/* CTA BUTTON */
.btn{
    margin-top:20px;
    padding:12px 25px;
    border:1px solid #c9a24e;
    color:#c9a24e;
    text-decoration:none;
    transition:0.3s;
}

.btn:hover{
    background:#c9a24e;
    color:#000;
}

/* SECTIONS */
.section{
    padding:80px 20px;
    text-align:center;
}

.section h2{
    color:#c9a24e;
    font-family:'Playfair Display', serif;
    margin-bottom:40px;
}

/* GALLERY GRID */
.grid{
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    max-width:1000px;
    margin:auto;
}

.card{
    border:1px solid rgba(201,162,78,0.2);
    padding:40px;
    transition:0.3s;
}

.card:hover{
    border-color:#c9a24e;
    transform:translateY(-5px);
}

.card a{
    color:#fff;
    text-decoration:none;
    font-size:16px;
    letter-spacing:1px;
}

/* FOOTER */
footer{
    text-align:center;
    padding:30px;
    color:#666;
    border-top:1px solid rgba(255,255,255,0.1);
}

</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="testimonials.html">Testimonials</a>
    <a href="contact.html">Contact</a>
</div>

<!-- HERO -->
<div class="hero">

    <img src="images/logo.jpg" alt="Nirvana Photoworks Logo">

    <h1>NIRVANA PHOTOWORKS</h1>
    <p>Timeless photography capturing emotion, elegance, and memories that last forever.</p>

    <a class="btn" href="contact.html">Book a Session</a>

</div>

<!-- SERVICES -->
<div class="section">

    <h2>Our Work</h2>

    <div class="grid">

        <div class="card"><a href="events.html">Events</a></div>
        <div class="card"><a href="portraits.html">Portraits</a></div>
        <div class="card"><a href="maternity.html">Maternity</a></div>
        <div class="card"><a href="family.html">Family</a></div>
        <div class="card"><a href="newborn.html">Newborn</a></div>

    </div>

</div>

<footer>
    © 2026 Nirvana Photoworks | All Rights Reserved
</footer>

</body>
</html>
