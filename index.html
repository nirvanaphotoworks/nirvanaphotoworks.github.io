<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nirvana Photoworks</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    background:#0a0a0a;
    color:#fff;
    font-family:'Inter', sans-serif;
}

/* NAV */
.nav{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:center;
    gap:30px;
    padding:20px;
    background:rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    z-index:1000;
}

.nav a{
    color:#c9a24e;
    text-decoration:none;
    font-size:14px;
    letter-spacing:1px;
}

.nav a:hover{
    color:#fff;
}

/* HERO */
.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;
    padding:0 10%;
    background: radial-gradient(circle at center,#1a1a1a,#000);
}

/* Brand */
.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo{
    width:60px;
    height:60px;
    object-fit:contain;
    filter: drop-shadow(0 0 10px rgba(201,162,78,0.25));
}

.brand-name{
    font-family:'Playfair Display', serif;
    font-size:42px;
    letter-spacing:6px;
    color:#c9a24e;
}

/* Tagline */
.tagline{
    margin:10px 0 5px 75px;
    color:#c9a24e;
    letter-spacing:3px;
    font-size:14px;
    text-transform:uppercase;
}

/* Subtext */
.subtext{
    margin:10px 0 0 75px;
    color:#aaa;
    max-width:420px;
    font-size:15px;
    line-height:1.6;
}

/* CTA */
.btn{
    margin:25px 0 0 75px;
    padding:12px 25px;
    border:1px solid #c9a24e;
    color:#c9a24e;
    text-decoration:none;
    transition:0.3s;
    display:inline-block;
}

.btn:hover{
    background:#c9a24e;
    color:#000;
}

/* SECTIONS */
.section{
    padding:80px 20px;
    text-align:center;
}

.section h2{
    color:#c9a24e;
    font-family:'Playfair Display', serif;
    margin-bottom:40px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    max-width:1000px;
    margin:auto;
}

.card{
    border:1px solid rgba(201,162,78,0.2);
    padding:40px;
    transition:0.3s;
}

.card:hover{
    border-color:#c9a24e;
    transform:translateY(-5px);
}

.card a{
    color:#fff;
    text-decoration:none;
    font-size:16px;
    letter-spacing:1px;
}

/* FOOTER */
footer{
    text-align:center;
    padding:30px;
    color:#666;
    border-top:1px solid rgba(255,255,255,0.1);
}

</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="testimonials.html">Testimonials</a>
    <a href="contact.html">Contact</a>
</div>

<!-- HERO -->
<div class="hero">

    <div class="brand">
        <img src="images/logo.jpeg" alt="Nirvana Photoworks Logo" class="logo">
        <div class="brand-name">NIRVANA</div>
    </div>

    <div class="tagline">Photoworks</div>

    <div class="subtext">
        Capturing moments with cinematic precision and timeless emotion.
    </div>

    <a class="btn" href="contact.html">Book a Session</a>

</div>

<!-- SERVICES -->
<div class="section">

    <h2>Our Work</h2>

    <div class="grid">

        <div class="card"><a href="events.html">Events</a></div>
        <div class="card"><a href="portraits.html">Portraits</a></div>
        <div class="card"><a href="maternity.html">Maternity</a></div>
        <div class="card"><a href="family.html">Family</a></div>
        <div class="card"><a href="newborn.html">Newborn</a></div>

    </div>

</div>

<footer>
    © 2026 Nirvana Photoworks | All Rights Reserved
</footer>

</body>
</html>
