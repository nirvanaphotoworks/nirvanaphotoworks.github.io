<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Nirvana Photoworks</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@200;300;400&family=Cormorant:ital,wght@1,300&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --black: #080808;
    --charcoal: #111010;
    --warm-dark: #141210;
    --gold: #c4a46b;
    --gold-light: #d4b87a;
    --gold-dim: rgba(196,164,107,0.18);
    --ivory: #f2ead8;
    --ivory-dim: rgba(242,234,216,0.55);
    --muted: rgba(242,234,216,0.35);
    --thin: rgba(196,164,107,0.15);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--ivory);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
  }

  /* NAVIGATION */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    padding: 28px 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    mix-blend-mode: normal;
    animation: fadeDown 1.2s ease 0.4s both;
    transition: background 0.3s ease, backdrop-filter 0.3s ease;
  }

  nav::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(8,8,8,0.85) 0%, transparent 100%);
    z-index: -1;
  }

  .nav-logo {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .nav-logo-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 18px;
    letter-spacing: 7px;
    color: var(--gold);
    text-transform: uppercase;
  }
  .nav-logo-sub {
    font-size: 9px;
    letter-spacing: 4px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .nav-links {
    display: flex;
    gap: 48px;
    list-style: none;
  }
  .nav-links a {
    color: var(--ivory-dim);
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: color 0.3s ease;
    position: relative;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px; left: 0;
    width: 0; height: 1px;
    background: var(--gold);
    transition: width 0.4s ease;
  }
  .nav-links a:hover { color: var(--gold); }
  .nav-links a:hover::after { width: 100%; }

  .nav-cta {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold) !important;
    border: 1px solid var(--thin);
    padding: 10px 22px;
    transition: all 0.4s ease !important;
  }
  .nav-cta:hover {
    background: var(--gold) !important;
    color: var(--black) !important;
    border-color: var(--gold) !important;
  }
  .nav-cta::after { display: none !important; }

  /* MOBILE NAV TOGGLE */
  .nav-toggle {
    display: none;
    background: none;
    border: none;
    color: var(--ivory);
    cursor: pointer;
    padding: 8px;
    z-index: 1100;
  }
  .nav-toggle span {
    display: block;
    width: 24px; height: 1px;
    background: var(--gold);
    margin: 6px 0;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  .nav-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .nav-toggle.open span:nth-child(2) { opacity: 0; }
  .nav-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* MOBILE MENU OVERLAY */
  .mobile-menu {
    position: fixed;
    inset: 0;
    background: rgba(8,8,8,0.98);
    backdrop-filter: blur(20px);
    z-index: 1050;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .mobile-menu.open { opacity: 1; pointer-events: auto; }
  .mobile-menu a {
    color: var(--ivory);
    text-decoration: none;
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
    transition: color 0.3s ease;
  }
  .mobile-menu a:hover { color: var(--gold); }

  /* HERO */
  .hero {
    position: relative;
    height: 100vh;
    min-height: 600px;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 65% 40%, rgba(60,45,20,0.45) 0%, transparent 70%),
      radial-gradient(ellipse 50% 80% at 30% 70%, rgba(30,20,10,0.6) 0%, transparent 60%),
      linear-gradient(160deg, #0d0b08 0%, #080808 40%, #0f0c09 100%);
    z-index: 0;
  }

  .hero-image {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 58%;
    overflow: hidden;
    z-index: 1;
  }
  .hero-image img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    animation: heroImageFade 1.8s cubic-bezier(0.16,1,0.3,1) 0.4s both;
  }
  
  @keyframes heroImageFade {
    from { opacity: 0; transform: scale(1.08); }
    to { opacity: 1; transform: scale(1); }
  }

  .hero-grain {
    position: absolute;
    inset: 0;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 200px;
    z-index: 3;
  }

  .hero-rule {
    position: absolute;
    left: 60px; top: 50%;
    transform: translateY(-50%);
    width: 1px; height: 0;
    background: linear-gradient(to bottom, transparent, var(--gold), transparent);
    animation: ruleGrow 1.8s cubic-bezier(0.16,1,0.3,1) 0.8s both;
    z-index: 4;
  }
  @keyframes ruleGrow { to { height: 40vh; } }

  .hero-deco-letter {
    position: absolute;
    right: -2vw; top: 50%;
    transform: translateY(-50%);
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(200px, 28vw, 420px);
    font-weight: 300;
    color: transparent;
    -webkit-text-stroke: 1px rgba(196,164,107,0.06);
    line-height: 1;
    user-select: none;
    animation: fadeIn 2s ease 1.2s both;
    pointer-events: none;
    z-index: 2;
  }

  .hero-content {
    position: relative;
    z-index: 5;
    padding: 0 60px 80px 100px;
    max-width: 700px;
    animation: heroRise 1.4s cubic-bezier(0.16,1,0.3,1) 0.6s both;
  }

  .hero-eyebrow {
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .hero-eyebrow::before {
    content: '';
    display: block;
    width: 40px; height: 1px;
    background: var(--gold);
  }

  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(36px, 5vw, 72px);
    font-weight: 300;
    line-height: 0.92;
    color: var(--ivory);
    margin-bottom: 8px;
  }
  .hero-title em {
    font-style: italic;
    color: var(--gold);
    display: block;
  }

  .hero-subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(16px, 2vw, 22px);
    color: var(--muted);
    margin-top: 20px;
    max-width: 440px;
    line-height: 1.6;
    letter-spacing: 0.5px;
  }

  .hero-actions {
    margin-top: 48px;
    display: flex;
    align-items: center;
    gap: 40px;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-block;
    text-decoration: none;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--black);
    background: var(--gold);
    padding: 16px 36px;
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
  }
  .btn-primary::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--ivory);
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
  }
  .btn-primary:hover::before { transform: scaleX(1); transform-origin: left; }
  .btn-primary span { position: relative; z-index: 1; }

  /* SERVICES GRID */
  .services {
    padding: 120px 60px;
    background: var(--warm-dark);
  }
  .section-header {
    text-align: center;
    margin-bottom: 80px;
  }
  .section-label {
    font-size: 9px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 20px;
    display: block;
  }
  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(38px, 5vw, 64px);
    font-weight: 300;
    color: var(--ivory);
    line-height: 1;
  }
  .section-title em { font-style: italic; color: var(--gold); }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    max-width: 1280px;
    margin: 0 auto;
  }

  .service-card {
    position: relative;
    overflow: hidden;
    text-decoration: none;
    display: block;
    background: #0d0b09;
    height: 340px;
    cursor: pointer;
  }

  .service-bg {
    position: absolute;
    inset: 0;
    transition: transform 0.8s cubic-bezier(0.16,1,0.3,1);
  }
  .service-card:hover .service-bg { transform: scale(1.06); }

  .bg-events    { background: url('images/events.jpg') center/cover; }
  .bg-portraits { background: url('images/portraits.jpg') center/cover; }
  .bg-maternity { background: url('images/maternity.jpg') center/cover; }
  .bg-family    { background: url('images/family.jpg') center/cover; }
  .bg-newborn   { background: url('images/newborn.jpg') center/cover; }
  
  .service-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(8,8,8,0.9) 0%, rgba(8,8,8,0.1) 60%, transparent 100%);
    transition: background 0.4s ease;
  }
  .service-card:hover .service-overlay {
    background: linear-gradient(to top, rgba(8,8,8,0.85) 0%, rgba(8,8,8,0.3) 60%, transparent 100%);
  }

  .service-content {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 32px;
    transform: translateY(8px);
    transition: transform 0.5s cubic-bezier(0.16,1,0.3,1);
  }
  .service-card:hover .service-content { transform: translateY(0); }

  .service-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--gold);
    opacity: 0.6;
    margin-bottom: 10px;
    display: block;
  }
  .service-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    font-weight: 300;
    color: var(--ivory);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .service-desc {
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--muted);
    line-height: 1.7;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.5s ease, opacity 0.4s ease;
    opacity: 0;
  }
  .service-card:hover .service-desc { max-height: 60px; opacity: 1; }

  .service-arrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 16px;
    opacity: 0;
    transform: translateX(-8px);
    transition: opacity 0.4s ease 0.1s, transform 0.4s ease 0.1s;
  }
  .service-card:hover .service-arrow { opacity: 1; transform: translateX(0); }
  .service-arrow::after {
    content: '';
    width: 24px; height: 1px;
    background: var(--gold);
  }

  /* WHATSAPP FLOATING */
  .whatsapp-float {
    position: fixed;
    bottom: 36px; right: 36px;
    z-index: 4000;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 22px;
    background: var(--warm-dark);
    border: 1px solid var(--thin);
    text-decoration: none;
    color: var(--ivory-dim);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: all 0.4s ease;
  }
  .whatsapp-float:hover {
    border-color: rgba(196,164,107,0.45);
    color: var(--gold);
    background: rgba(196,164,107,0.06);
  }
  .whatsapp-float svg {
    width: 16px; height: 16px;
    fill: #25D366;
    flex-shrink: 0;
  }

  /* ANIMATIONS */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes heroRise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

  /* RESPONSIVE — TABLET */
  @media (max-width: 1024px) {
    .hero-image { width: 52%; }
    .services-grid { grid-template-columns: 1fr 1fr; }
  }

  /* RESPONSIVE — MOBILE */
  @media (max-width: 768px) {
    nav { padding: 20px 24px; }
    .nav-links { display: none; }
    .nav-toggle { display: block; }

    .hero { min-height: 100vh; }
    .hero-image { width: 100%; opacity: 0.55; }

    .hero-content { padding: 0 24px 80px 24px; max-width: 100%; }
    .hero-rule { left: 16px; height: 30vh; }
    .hero-deco-letter { font-size: 180px; right: -8vw; }
    .services { padding: 80px 20px; }

    .services-grid { grid-template-columns: 1fr; }
    .services-grid .service-card { height: 260px; }

    .whatsapp-float { bottom: 20px; right: 20px; padding: 12px 16px; }
    .whatsapp-text { display: none; }
  }
</style>
</head>
