<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Nirvana Photoworks</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@200;300;400&family=Cormorant:ital,wght@1,300&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --black: #080808;
    --charcoal: #111010;
    --warm-dark: #141210;
    --gold: #c4a46b;
    --gold-light: #d4b87a;
    --gold-dim: rgba(196,164,107,0.18);
    --ivory: #f2ead8;
    --ivory-dim: rgba(242,234,216,0.55);
    --muted: rgba(242,234,216,0.35);
    --thin: rgba(196,164,107,0.15);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--ivory);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
  }

  /* NAVIGATION */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    padding: 28px 60px;
    display: flex; align-items: center; justify-content: space-between;
    transition: background 0.3s ease;
  }

  .nav-links { display: flex; gap: 48px; list-style: none; }
  .nav-links a {
    color: var(--ivory-dim); text-decoration: none; font-size: 11px;
    letter-spacing: 3px; text-transform: uppercase; transition: color 0.3s ease;
  }
  .nav-links a:hover { color: var(--gold); }
  .nav-cta { color: var(--gold) !important; border: 1px solid var(--thin); padding: 10px 22px; }

  /* MOBILE MENU TOGGLE */
  .nav-toggle { display: none; flex-direction: column; gap: 6px; cursor: pointer; z-index: 1001; }
  .nav-toggle span { width: 25px; height: 1px; background: var(--gold); transition: 0.3s; }
  
  .mobile-menu {
    position: fixed; inset: 0; background: var(--black); z-index: 999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 40px; transform: translateY(-100%); transition: transform 0.5s ease;
  }
  .mobile-menu.open { transform: translateY(0); }
  .mobile-menu a { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--ivory); text-decoration: none; }

  /* HERO & SECTIONS */
  .about-hero { padding: 220px 60px 100px; text-align: center; border-bottom: 1px solid var(--thin); }
  .about-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(42px, 6vw, 80px); color: var(--ivory); }
  .bio-section { padding: 140px 60px; max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 100px; align-items: center; }
  
  /* MEDIA QUERIES */
  @media (max-width: 768px) {
    nav { padding: 20px 30px; }
    .nav-links { display: none; }
    .nav-toggle { display: flex; }
    .about-hero { padding: 120px 20px 60px; }
    .bio-section { grid-template-columns: 1fr; padding: 60px 20px; gap: 40px; }
    .about-visual-grid { height: 350px !important; }
  }

  /* ... (Keep all other CSS from your original snippet) ... */
</style>
</head>
<body>

<nav>
  <img src="images/logo.jpeg" alt="Logo" style="height: 45px; width: auto;">
  
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html" class="nav-cta">Book Session</a></li>
  </ul>

  <div class="nav-toggle" id="navToggle">
    <span></span><span></span><span></span>
  </div>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="index.html">Home</a>
  <a href="gallery.html">Gallery</a>
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>
</div>

<script>
  // Mobile Menu Logic
  const navToggle = document.getElementById('navToggle');
  const mobileMenu = document.getElementById('mobileMenu');

  navToggle.addEventListener('click', () => {
    mobileMenu.classList.toggle('open');
  });

  // Keep your existing Intersection Observer and Scroll Logic below
  const reveals = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  reveals.forEach(el => observer.observe(el));
</script>
</body>
</html>
