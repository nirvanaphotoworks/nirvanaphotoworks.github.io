<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@200;300;400&family=Cormorant:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --black: #080808; --charcoal: #111010; --warm-dark: #141210;
    --gold: #c4a46b; --gold-light: #d4b87a; --gold-dim: rgba(196,164,107,0.18);
    --ivory: #f2ead8; --ivory-dim: rgba(242,234,216,0.55); --muted: rgba(242,234,216,0.35);
    --thin: rgba(196,164,107,0.15);
  }
  html { scroll-behavior: smooth; }
  body { background: var(--black); color: var(--ivory); font-family: 'DM Sans', sans-serif; font-weight: 300; overflow-x: hidden; cursor: none; }

  /* CUSTOM CURSOR */
  .cursor, .cursor-ring { position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); border-radius: 50%; }
  .cursor { width: 10px; height: 10px; background: var(--gold); mix-blend-mode: difference; }
  .cursor-ring { width: 36px; height: 36px; border: 1px solid var(--gold); opacity: 0.6; transition: width 0.3s, height 0.3s, opacity 0.3s; }
  body:has(a:hover) .cursor-ring, body:has(button:hover) .cursor-ring { width: 60px; height: 60px; opacity: 0.25; }

  /* NAV - Updated for Right Alignment */
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 28px 60px; display: flex; align-items: center; justify-content: space-between; animation: fadeDown 1.2s ease 0.4s both; }
  .nav-logo { display: flex; align-items: center; text-decoration: none; }
  .nav-links { display: flex; gap: 48px; list-style: none; align-items: center; }
  .nav-links a { color: var(--ivory-dim); text-decoration: none; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; transition: color 0.3s; }
  .nav-links a:hover { color: var(--gold); }
  .nav-cta { color: var(--gold) !important; border: 1px solid var(--thin); padding: 10px 22px; }
  .nav-cta:hover { background: var(--gold) !important; color: var(--black) !important; }

  /* WHATSAPP FLOAT */
  .whatsapp-float { position: fixed; bottom: 36px; right: 36px; z-index: 4000; display: flex; align-items: center; gap: 12px; padding: 14px 22px; background: var(--warm-dark); border: 1px solid var(--thin); text-decoration: none; color: var(--ivory-dim); font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }
  .whatsapp-float:hover { border-color: var(--gold); color: var(--gold); }
  .whatsapp-float svg { width: 16px; height: 16px; fill: #25D366; }

  /* ABOUT SECTIONS (Same as provided) */
  .about-hero { padding: 220px 60px 100px; text-align: center; border-bottom: 1px solid var(--thin); }
  .about-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(42px, 6vw, 80px); }
  .bio-section { padding: 140px 60px; max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 100px; align-items: center; }
  .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.9s, transform 0.9s; }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  @media (max-width: 768px) { .nav-links { display: none; } .whatsapp-text { display: none; } }
</style>
