<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Family - Nirvana Photoworks</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b0b0b;
        color: white;
    }

    .nav {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 15px;
        padding: 20px;
        background: #000;
    }

    .nav a {
        color: #c9a24e;
        text-decoration: none;
        font-size: 14px;
    }

    h2 {
        text-align: center;
        color: #c9a24e;
        padding: 30px;
        font-weight: 300;
        letter-spacing: 2px;
    }

    .gallery {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
        padding: 20px;
    }

    .gallery img {
        width: 300px;
        height: 220px;
        object-fit: cover;
        border-radius: 10px;
        cursor: pointer;
        border: 1px solid rgba(201,162,78,0.3);
        transition: 0.3s;
    }

    .gallery img:hover {
        transform: scale(1.03);
    }

    /* LIGHTBOX */
    .lightbox {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.95);
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 999;
    }

    .lightbox img {
        max-width: 90%;
        max-height: 80%;
        border-radius: 10px;
    }

    .controls {
        margin-top: 15px;
    }

    .controls button {
        background: #c9a24e;
        border: none;
        padding: 10px 15px;
        margin: 5px;
        cursor: pointer;
        font-weight: bold;
    }

    .close {
        position: absolute;
        top: 20px;
        right: 25px;
        font-size: 35px;
        color: #c9a24e;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="nav">
    <a href="index.html">Home</a>
    <a href="events.html">Events</a>
    <a href="portraits.html">Portraits</a>
    <a href="maternity.html">Maternity</a>
    <a href="family.html">Family</a>
    <a href="newborn.html">Newborn</a>
    <a href="contact.html">Contact</a>
</div>

<h2>Family Photography</h2>

<div class="gallery">
    <img src="images/family/1.jpg">
    <img src="images/family/2.jpg">
    <img src="images/family/3.jpg">
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
    <div class="close" onclick="closeLightbox()">×</div>

    <img id="lightbox-img">

    <div class="controls">
        <button onclick="prevImg()">Prev</button>
        <button onclick="nextImg()">Next</button>
    </div>
</div>

<script>
const images = [
    "images/family/1.jpg",
    "images/family/2.jpg",
    "images/family/3.jpg"
];

let currentIndex = 0;

const imgs = document.querySelectorAll(".gallery img");

imgs.forEach((img, index) => {
    img.addEventListener("click", () => {
        currentIndex = index;
        openLightbox();
    });
});

function openLightbox() {
    document.getElementById("lightbox").style.display = "flex";
    updateImage();
}

function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
}

function updateImage() {
    document.getElementById("lightbox-img").src = images[currentIndex];
}

function nextImg() {
    currentIndex = (currentIndex + 1) % images.length;
    updateImage();
}

function prevImg() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    updateImage();
}
</script>

</body>
</html>
