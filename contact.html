<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Nirvana Photoworks</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
}

.container{
    max-width: 900px;
    margin: auto;
    padding: 40px 20px;
}

h1{
    text-align: center;
    margin-bottom: 20px;
}

form{
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

input, select, textarea{
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
}

.row{
    display: flex;
    gap: 10px;
}

.row input{
    flex: 1;
}

button{
    width: 100%;
    padding: 14px;
    background: black;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

button:hover{
    opacity: 0.9;
}

.info{
    margin-top: 30px;
    text-align: center;
}

.info a{
    color: #E1306C;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Contact Us</h1>

<form id="contact-form">

    <div class="row">
        <input type="text" name="first_name" placeholder="First Name" required>
        <input type="text" name="last_name" placeholder="Last Name" required>
    </div>

    <input type="email" name="email" placeholder="Email" required>

    <input type="tel" name="phone" placeholder="Mobile Phone">

    <select name="service" required>
        <option value="">Select Service</option>
        <option>Wedding</option>
        <option>Engagement</option>
        <option>Portrait</option>
        <option>Event</option>
        <option>Commercial</option>
    </select>

    <input type="date" name="event_date">

    <input type="text" name="location" placeholder="Location">

    <select name="referral">
        <option value="">How did you hear about us?</option>
        <option>Instagram</option>
        <option>Google</option>
        <option>Facebook</option>
        <option>Friend</option>
        <option>Other</option>
    </select>

    <textarea name="message" placeholder="Your Message" required></textarea>

    <button type="submit">Send Message</button>

</form>

<div class="info">
    <p>Email: contact.nirvanaphotoworks@gmail.com</p>
    <p>Phone: 341-345-9974</p>
    <p>
        Instagram:
        <a href="https://instagram.com/nirvana_photoworks/" target="_blank">
            @nirvana_photoworks
        </a>
    </p>
</div>

</div>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init("w-wFdRibnMc4MNGLC");

document.getElementById("contact-form").addEventListener("submit", function(event) {
    event.preventDefault();

    emailjs.sendForm(
        "service_gw7cwgk",
        "template_b4ynp2w",
        this
    )
    .then(() => {
        alert("Message sent successfully!");
        this.reset();
    })
    .catch((error) => {
        console.log(error);
        alert("Failed to send message.");
    });
});
  <a class="whatsapp-float"
   href="https://wa.me/13413459974?text=Hi%20Nirvana%20Photoworks%2C%20I%20would%20like%20to%20book%20a%20photoshoot."
   target="_blank">

    💬 Chat on WhatsApp
     
</a>
</script>

</body>
</html>
