<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Nirvana Photoworks</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --black: #080808;
    --charcoal: #111010;
    --warm-dark: #141210;
    --gold: #c4a46b;
    --gold-light: #d4b87a;
    --gold-dim: rgba(196,164,107,0.18);
    --ivory: #f2ead8;
    --ivory-dim: rgba(242,234,216,0.55);
    --muted: rgba(242,234,216,0.35);
    --thin: rgba(196,164,107,0.15);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--ivory);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
    cursor: none;
  }

  .cursor {
    position: fixed;
    width: 10px; height: 10px;
    background: var(--gold);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
  }

  .cursor-ring {
    position: fixed;
    width: 36px; height: 36px;
    border: 1px solid var(--gold);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    opacity: 0.6;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    padding: 28px 60px;
    display: flex;
    justify-content: space-between;
  }

  nav::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(8,8,8,0.92), transparent);
    z-index: -1;
  }

  /* HERO (TIGHTENED) */
  .page-hero {
    height: 38vh;
    min-height: 220px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0 60px 30px;
    position: relative;
  }

  .page-hero-deco {
    position: absolute;
    left: 50%; top: 45%;
    transform: translate(-50%, -50%);
    font-size: clamp(180px, 25vw, 380px);
    color: transparent;
    -webkit-text-stroke: 1px rgba(196,164,107,0.03);
    pointer-events: none;
  }

  .page-hero-eyebrow {
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--gold);
  }

  /* FORM CONTAINER (TIGHTENED) */
  .contact-container {
    max-width: 820px;
    margin: 0 auto;
    padding: 60px 40px 140px 40px;
  }

  .form-header {
    text-align: center;
    margin-bottom: 28px;
  }

  .form-header-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px;
    font-weight: 300;
  }

  form { display: flex; flex-direction: column; }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
  }

  .form-field {
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .form-field input,
  .form-field select,
  .form-field textarea {
    background: rgba(196,164,107,0.03);
    border: 1px solid var(--thin);
    color: var(--ivory);
    padding: 38px 20px 16px;
    font-size: 14px;
  }

  .btn-submit {
    width: 100%;
    padding: 22px;
    background: var(--gold);
    border: none;
    cursor: none;
  }

  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--warm-dark);
    padding: 18px 40px;
    opacity: 0;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* responsive */
  @media (max-width: 768px) {
    .page-hero { height: 30vh; }
    .contact-container { padding: 40px 20px 100px; }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
</head>

<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<nav>
  <a href="index.html">Nirvana Photoworks</a>
</nav>

<header class="page-hero">
  <div class="page-hero-deco">C</div>
  <div class="page-hero-eyebrow">Let's Create Together</div>
</header>

<main class="contact-container">

  <div class="form-header">
    <h2 class="form-header-title">
      Every great image starts with a conversation.
    </h2>
  </div>

  <form id="contact-form">
    <div class="form-row">
      <input placeholder="First Name" required>
      <input placeholder="Last Name" required>
    </div>

    <input type="email" placeholder="Email Address" required>
    <input type="tel" placeholder="Phone">

    <textarea placeholder="Your Message" required></textarea>

    <button class="btn-submit">
      Send Enquiry
    </button>
  </form>

</main>

<div class="toast" id="toast">Message sent</div>

</body>
</html>
